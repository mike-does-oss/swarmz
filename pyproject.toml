[project]
name = "swarmz"
version = "0.1.0"
description = "swarmz: local forecasting swarm with persistent personas, scoring, selection, calibration and lessons"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "numpy>=1.26",
    "anthropic>=0.49",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "httpx>=0.27",
]

[project.scripts]
swarmz = "swarmz.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarmz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs live API keys"]
addopts = "-m 'not integration'"
