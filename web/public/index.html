<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supercast</title>
<meta name="description" content="Supercast puts a yes or no question to a panel of ten forecasting agents, lets them argue it out, and pools their forecasts. Research prototype.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0e13'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8b84a'/%3E%3Ccircle cx='7' cy='9' r='2.5' fill='%235b9cf0'/%3E%3Ccircle cx='25' cy='10' r='2.5' fill='%233fc1b0'/%3E%3Ccircle cx='9' cy='25' r='2.5' fill='%23f08a4b'/%3E%3Ccircle cx='24' cy='24' r='2.5' fill='%23c3c9d4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
  body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }
  /* Two views under one header. Overview: figures for every panel run and for the registry as a whole;
     it scrolls. Run replay: one screen, described next.
     Layout: one screen. A 3D graph of the panel fills the stage and turns as the rounds play.
     Posts, replies and likes pop on the graph at the moment they happen and scroll past in the
     terminal on the right. Agents sit over the graph's left edge; playback, the forecast chart
     and the run's figures run along the bottom. Single dark look by choice. */
  :root {
    color-scheme: dark;
    --bg: #0b0e15; --panel: #151a25; --panel-2: #1f2634; --line: #343d4f; --term: #080b12; --glow: #1b2540;
    --ink: #ecebe6; --text2: #c5cad3; --dim: #a9b1bf; --faint: #7a8496;
    --yes: #45dfbe; --no: #ff6d5b; --core: #9d8cf5; --like: #ff5c8a;
    --space: radial-gradient(1.5px 1.5px at 23px 31px, rgba(255,255,255,.75), transparent 60%) 0 0 / 190px 170px, radial-gradient(1.2px 1.2px at 111px 87px, rgba(200,215,255,.65), transparent 60%) 0 0 / 230px 210px, radial-gradient(1.8px 1.8px at 67px 139px, rgba(255,255,255,.45), transparent 60%) 0 0 / 310px 270px, radial-gradient(circle at 20% 16%, rgba(58, 96, 190, .26) 0, transparent 42%), radial-gradient(circle at 84% 80%, rgba(98, 70, 186, .2) 0, transparent 46%), radial-gradient(circle at 62% 42%, rgba(36, 118, 160, .12) 0, transparent 38%), radial-gradient(circle at 50% 50%, #0d1529 0, #070c19 60%, #03050b 100%);
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: radial-gradient(circle at 12% -8%, #17233f 0, transparent 46%), radial-gradient(circle at 96% 4%, #1f1a3d 0, transparent 40%), var(--bg); background-attachment: fixed; color: var(--ink); font: 400 12px/1.45 var(--mono); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--core); outline-offset: 2px; }

  .app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-block: 10px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow: hidden; }

  .bar { display: flex; align-items: center; gap: 12px; padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .bar .chip { flex: none; font-weight: 700; font-size: 11px; letter-spacing: .06em; padding: 4px 8px; border-radius: 5px; background: var(--core); color: var(--bg); }
  .bar h1 { margin: 0; font: 700 13px/1.3 var(--mono); letter-spacing: .02em; min-width: 0; flex: 1; overflow-wrap: anywhere; }
  .bar .counts { flex: none; color: var(--dim); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

  .mid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 10px; min-height: 0; }
  .stagewrap { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
               background: var(--space); border-color: #3a4763; }
  .stage { position: absolute; inset: 0; touch-action: pan-y; cursor: grab; }
  .stage.drag { cursor: grabbing; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #pills { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .pill { position: absolute; left: 0; top: 0; pointer-events: auto; white-space: nowrap; font: 500 11px/1 var(--mono); padding: 5px 9px; border-radius: 999px;
          border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 20%, #0c1322); color: var(--ink); will-change: transform; }
  .pill b { font-weight: 700; color: var(--c); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .pill i { font-style: normal; color: var(--like); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .pill i:empty { display: none; }
  .pill.ch { border-style: dashed; }
  .pill.sel { background: color-mix(in srgb, var(--c) 44%, #0c1322); }
  .tag { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 10px; color: var(--text2); letter-spacing: .04em; will-change: transform; }
  .bub { position: absolute; left: 0; top: 0; pointer-events: auto; width: max-content; max-width: 230px; text-align: left; font: 400 10.5px/1.35 var(--mono); padding: 6px 8px;
         border-radius: 7px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 12%, var(--term)); color: var(--text2); will-change: transform, opacity; }
  .bub b { color: var(--c); font-weight: 700; }
  .bub em { font-style: normal; color: var(--ink); font-weight: 700; margin-left: 4px; }
  .bub span { display: block; margin-top: 2px; }

  .legend { position: absolute; left: 10px; top: 10px; width: 306px; background: color-mix(in srgb, #0f1524 88%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px 8px; }
  .legend .lh { display: grid; grid-template-columns: minmax(0, 1fr) 4ch 4ch; gap: 8px; color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 0 6px 5px; }
  .legend .lh span + span { text-align: right; }
  .legend ul { list-style: none; margin: 0; padding: 0; }
  .legend li button { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) 4ch 4ch; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 5px; text-align: left; }
  .legend li button:hover, .legend li button.sel { background: var(--panel-2); }
  .legend .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .legend .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .nm i { font-style: normal; color: var(--faint); font-size: 10px; margin-left: 5px; }
  .legend .lk { color: var(--like); text-align: right; font-variant-numeric: tabular-nums; }
  .legend .pv { color: var(--c); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .legend .mode { display: flex; align-items: center; gap: 6px; margin-top: 7px; padding: 7px 6px 0; border-top: 1px solid var(--line); color: var(--faint); }
  .legend .mode button { padding: 2px 7px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); }
  .legend .mode button[aria-pressed="true"] { border-color: var(--core); color: var(--ink); }
  .legend .scale { display: flex; align-items: center; gap: 6px; padding: 6px 6px 0; color: var(--faint); font-size: 10px; }
  .legend .scale span.g { flex: 1; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--no), var(--ink), var(--yes)); }
  .legend .hint { padding: 7px 6px 0; color: var(--faint); font-size: 10px; }

  .stepname { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 11px; color: var(--text2); pointer-events: none; white-space: nowrap; }
  .readout { position: absolute; right: 12px; bottom: 9px; color: var(--dim); font-size: 10px; letter-spacing: .04em; pointer-events: none; font-variant-numeric: tabular-nums; }

  .term { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--term); border: 1px solid var(--line); border-radius: 8px; }
  .termhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 11px; }
  .termhead strong { color: var(--ink); font-weight: 700; }
  .termhead span { font-variant-numeric: tabular-nums; text-align: right; }
  .termhead .lk { color: var(--like); }
  #sel { margin: 8px 8px 0; padding: 9px 10px; border: 1px solid var(--core); border-radius: 7px; background: var(--panel-2); max-height: 45%; overflow-y: auto; }
  #sel .x { float: right; color: var(--dim); padding: 0 2px 4px 8px; }
  #sel .k { color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  #sel .ph { display: flex; align-items: baseline; gap: 7px; margin-top: 3px; }
  #sel .nm { color: var(--c); font-weight: 700; }
  #sel .ch { color: var(--faint); font-size: 10px; }
  #sel .pv { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  #sel p { margin: 5px 0 0; color: var(--text2); font-size: 11.5px; line-height: 1.5; overflow-wrap: anywhere; }
  #sel .pf { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; color: var(--dim); font-size: 10.5px; }
  #sel .pf b { font-weight: 500; }
  #sel dl { margin: 6px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font-size: 11.5px; }
  #sel dt { color: var(--faint); }
  #sel dd { margin: 0; color: var(--ink); }
  #term { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px 12px; font-size: 11.5px; line-height: 1.5; overflow-wrap: anywhere; }
  .ln { display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; padding: 1px 0; animation: lnin .7s ease-out; }
  @keyframes lnin { from { background: color-mix(in srgb, var(--ink) 16%, transparent); } to { background: transparent; } }
  .ln .tg { flex: none; width: 4ch; color: var(--faint); }
  .ln.hd { display: block; color: var(--ink); font-weight: 700; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .ln.hd:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  .ln.hd small { display: block; font-weight: 400; color: var(--faint); font-size: 10.5px; }
  .ln.post { margin-top: 7px; cursor: pointer; }
  .ln .nm { color: var(--c); font-weight: 700; }
  .ln .ch { color: var(--faint); font-size: 10px; }
  .ln .st { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dl { color: var(--dim); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
  .dl.up { color: var(--yes); } .dl.dn { color: var(--no); }
  .ln p { flex-basis: 100%; margin: 1px 0 0; padding-left: calc(4ch + 8px); color: var(--text2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ln.sel p { display: block; color: var(--ink); }
  .ln.ev { color: var(--dim); cursor: pointer; flex-wrap: nowrap; }
  .ln.ev > span:last-child { min-width: 0; }
  .ln .gl { flex: none; width: 1.6ch; text-align: center; color: var(--ink); }
  .ln .gl.lk { color: var(--like); }
  .ln.end { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--ink); }
  .cursor { display: inline-block; width: 7px; height: 13px; margin-top: 8px; background: var(--ink); animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .deck { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 10px; }
  .play { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 6px; min-width: 0; }
  .transport { display: flex; align-items: center; gap: 10px; }
  .transport .pp { width: 74px; padding: 5px 0; border-radius: 5px; background: var(--ink); color: var(--bg); font-weight: 700; }
  .transport .sp { width: 40px; padding: 4px 0; border-radius: 5px; border: 1px solid var(--line); color: var(--dim); }
  .transport input { flex: 1; min-width: 0; accent-color: var(--core); }
  .transport output { flex: none; color: var(--dim); min-width: 13ch; text-align: right; }
  .chartwrap { position: relative; height: 118px; margin-top: 4px; }
  .chartwrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .figs { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; align-content: center; }
  .figs div { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .figs dt { color: var(--dim); font-size: 11px; }
  .figs dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }

  @media (max-width: 880px) {
    html, body { height: auto; }
    .app { height: auto; overflow: visible; display: flex; flex-direction: column; }
    .bar { flex-wrap: wrap; }
    .mid, .deck { grid-template-columns: minmax(0, 1fr); }
    .stagewrap { display: flex; flex-direction: column; overflow: visible; background: none; border: 0; gap: 10px; }
    .stage { position: relative; inset: auto; height: 58vh; min-height: 340px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--space); border-color: #3a4763; }
    .legend { position: static; width: auto; }
    .stepname { top: 10px; }
    .readout { display: none; }
    .term { height: 70vh; }
    .bub { max-width: 170px; }
    .transport { flex-wrap: wrap; }
    .transport input { flex-basis: 100%; order: 3; }
    .deck { order: 2; } .mid { order: 1; }
  }
  @media (prefers-reduced-motion: reduce) { .ln, .cursor { animation: none; } }

  /* ---------- shell ---------- */
  a { color: inherit; }
  .bar { flex: none; }
  .bar .chip { text-decoration: none; }
  .tabs { display: flex; gap: 4px; flex: none; }
  .tabs a { text-decoration: none; padding: 4px 9px; border-radius: 5px; border: 1px solid transparent; color: var(--dim); font-size: 11px; }
  .tabs a:hover { color: var(--ink); }
  .tabs a[aria-current="page"] { border-color: var(--line); background: var(--panel-2); color: var(--ink); }
  #runpick { flex: none; max-width: 300px; font: inherit; font-size: 11px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; }
  #view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .run { flex: 1; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; }
  #tip { position: fixed; z-index: 9999; pointer-events: none; white-space: pre-line; background: var(--term); border: 1px solid var(--faint); border-radius: 6px;
         padding: 6px 9px; font-size: 11px; line-height: 1.5; color: var(--ink); font-variant-numeric: tabular-nums; max-width: 280px; }

  /* ---------- overview ---------- */
  .ov { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .ov > * { flex: none; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 11px; min-width: 0; }
  .tile .k { color: var(--dim); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  .tile .v { font: 700 24px/1.2 var(--mono); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .tile .s { color: var(--dim); font-size: 11px; margin-top: 3px; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 10px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
  .card > header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; padding: 10px 12px 9px; border-bottom: 1px solid var(--line); }
  .card h2 { margin: 0; font: 700 12px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .card .note { margin: 0; color: var(--dim); font-size: 11px; flex: 1; min-width: min(100%, 240px); max-width: 110ch; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px 0; color: var(--dim); font-size: 10.5px; }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { position: static; transform: none; flex: none; }
  .scroll { overflow-x: auto; }
  .ov table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  .ov th { text-align: left; font-weight: 400; color: var(--faint); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 12px 6px; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .ov td { padding: 7px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .ov tr:last-child td { border-bottom: 0; }
  .ov .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ov .nw { white-space: nowrap; }
  .ov td small { display: block; color: var(--faint); font-size: 10px; margin-top: 1px; }
  .ov td.dimc, .ov .dimc { color: var(--faint); }
  .ov tr.go { cursor: pointer; }
  .ov tr.go:hover td, .ov tr.hl td { background: var(--panel-2); }
  .ov tr.total td { font-weight: 700; }
  .ov td a { text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .ov td a:hover { text-decoration-color: var(--ink); }
  .qc { min-width: 230px; max-width: 380px; overflow-wrap: anywhere; }
  .mth { min-width: 220px; max-width: 420px; color: var(--text2); }
  .flag { display: inline-block; margin-left: 8px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--dim); font-size: 10px; white-space: nowrap; }
  .who { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 700; }
  .who i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  /* where one run's four numbers sit between 0% and 100% */
  .strip { position: relative; width: 200px; height: 18px; }
  .strip::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line); }
  .strip::after { content: ""; position: absolute; left: 50%; top: 4px; bottom: 4px; width: 1px; background: var(--faint); }
  .strip i { position: absolute; top: 50%; transform: translate(-50%, -50%); }
  i.mk { width: 2px; height: 14px; background: var(--ink); z-index: 1; }
  i.sc { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--text2); z-index: 2; }
  i.al { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); z-index: 3; }
  i.fi { width: 11px; height: 11px; border-radius: 50%; background: var(--core); box-shadow: 0 0 0 2px var(--panel); z-index: 4; }
  /* a magnitude bar: one hue, length is the value */
  .mag { position: relative; display: block; min-width: 110px; height: 10px; background: var(--panel-2); border-radius: 0 4px 4px 0; }
  .mag i { display: block; height: 100%; min-width: 1px; background: color-mix(in srgb, var(--core) 78%, var(--bg)); border-radius: 0 4px 4px 0; }
  .mag.ref i { background: var(--faint); }
  .mag.lk i { background: color-mix(in srgb, var(--like) 78%, var(--bg)); }
  .mag.half::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--dim); }
  .foot { color: var(--faint); font-size: 10.5px; padding: 2px 2px 8px; }

  @media (max-width: 880px) {
    #view { display: block; }
    .run { display: flex; flex-direction: column; }
    .ov { overflow: visible; }
    .bar h1 { flex-basis: 100%; order: 5; }
    #runpick { max-width: 100%; min-width: 0; flex: 1; }
    .tile .v { font-size: 20px; }
  }

  /* ---------- run figures panel ---------- */
  :root { --s-rep: #8b79ec; --s-like: #f04f7f; }
  .play { display: flex; flex-direction: column; }
  .chartwrap { flex: 1; height: auto; min-height: 118px; }
  .figbox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 9px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .figbox > header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .figbox h2 { margin: 0; font: 400 10.5px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .expand { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 5px; color: var(--text2); font-size: 10.5px; }
  .expand:hover { color: var(--ink); border-color: var(--faint); background: var(--panel-2); }
  .expand svg { width: 12px; height: 12px; flex: none; }
  .figbox .figs { background: none; border: 0; border-radius: 0; padding: 0; flex: 1; }
  .figs div { cursor: help; border-radius: 3px; }
  .figs div:focus-visible { outline: 2px solid var(--core); outline-offset: 2px; }
  .figs dt { display: inline-flex; align-items: center; gap: 6px; }
  .figs dt i { flex: none; }
  .figs dt i.mk { height: 10px; }
  .rng { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 10px; }
  .rng .strip { flex: 1; width: auto; height: 20px; cursor: help; }
  .strip.zoom::after { display: none; }
  .strip i.half { width: 1px; height: 10px; background: var(--faint); }
  .strip u { position: absolute; top: 50%; height: 2px; transform: translateY(-50%); opacity: .65; }

function belief(p) {

  return a.map((v, i) => Math.round(v + (b[i] - v) * k));

const tint = p => p == null ? 'inherit' : `rgb(${belief(p).join(',')})`;
// a heading or a column head carries its explainer as a tooltip
const head = (title, tipText) => `<h2 tabindex="0" data-tip="${esc(tipText)}">${title}<i class="q" aria-hidden="true">?</i></h2>`;
const th = (label, tipText, cls) => `<th${cls ? ` class="${cls}"` : ''}${tipText ? ` tabindex="0" data-tip="${esc(tipText)}"` : ''}>${label}</th>`;

const emptyRow = (n, text) => `<tr><td colspan="${n}" class="empty">${esc(text)}</td></tr>`;

const TIP = {
  finished: 'Runs the panel has completed. Click a row to replay it.',
  queued: 'Markets and questions approved to run next.',
  submitted: 'Markets and questions waiting for approval.',
  scored: 'Finished runs whose market has settled.',
  submit: 'A Kalshi market by its ticker, or your own yes or no question. It runs only after it is approved.',
  type: 'Kalshi: a market on Kalshi, priced and settled there.\nOwn question: no market price, so the single call on the brief stands in for it, and the outcome is entered by hand.',
  slot: 'Queued Kalshi markets run one every two hours, oldest first. An own question needs its brief written first.',
  pending: 'Queued: approved and waiting to run.\nAwaiting approval: submitted and not yet decided.',

  id: 'The Kalshi ticker, or the ID given to an own question.',
  strip: 'Where the four numbers sit between 0% and 100%.',

  single: 'One plain model call on the whole brief, with no panel.',

  moved: 'Final less before talking, in points.',

};

// Checks shared by the page and the API. The build copies this file into the page, so both agree on what is valid.
const TICKER = /^[A-Z0-9]{2,}(-[A-Z0-9.]+){1,4}$/, QID = /^q-[0-9a-f]{14}$/, DATE = /^\d{4}-\d{2}-\d{2}$/, MAX_MINE = 10;
const okTicker = s => typeof s === 'string' && s.length <= 64 && TICKER.test(s);
const okId = s => okTicker(s) || (typeof s === 'string' && QID.test(s));
// a ticker as typed, or the last part of a pasted Kalshi link
const normTicker = raw => { let s = String(raw || '').trim(); if (s.includes('/')) s = s.split(/[?#]/)[0].split('/').filter(Boolean).pop() || ''; s = s.toUpperCase(); return okTicker(s) ? s : null; };
const squash = s => String(s).replace(/\s+/g, ' ').trim();
const today = () => new Date().toISOString().slice(0, 10);
const okDate = s => typeof s === 'string' && DATE.test(s) && !isNaN(Date.parse(s + 'T00:00:00Z'));
function hash53(s) {
  let a = 0xdeadbeef, b = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return 4294967296 * (2097151 & b) + (a >>> 0);
}
// An own question, cleaned and given its ID, or null. The ID is a hash of the wording, so the same question asked twice is one row.
function own(o) {
  if (!o || typeof o.text !== 'string' || typeof o.criteria !== 'string' || !okDate(o.resolves)) return null;
  const text = squash(o.text), criteria = squash(o.criteria);
  if (text.length < 12 || text.length > 200 || criteria.length < 12 || criteria.length > 400) return null;
  return { id: 'q-' + hash53([text, o.resolves, criteria].join('\n').toLowerCase()).toString(16).padStart(14, '0'), kind: 'q', text, resolves: o.resolves, criteria };
}

// ---------- the queue and submissions, kept by the API ----------
const ADMIN = location.pathname.replace(/\/+$/, '') === '/wp-admin', API = ADMIN ? '/api/admin' : '/api/state';
const Cap = e => e.kind === 'q' ? 'Question' : e.id, That = e => e.kind === 'q' ? 'This question' : e.id;
const FINISHED = new Set(APP.runs.map(r => r.question_id));
const live = { state: 'loading', admin: false, user: null, rows: null, costs: null, busy: false, msg: null, mode: 'kalshi' };
const stamp = v => { const t = typeof v === 'string' ? Date.parse(v) : NaN; return isNaN(t) ? null : new Date(t).toISOString(); };
const when = iso => iso ? iso.slice(0, 16).replace('T', ' ') : '–';
const byAt = (a, b) => (a.at || '').localeCompare(b.at || '');
function derive() {                                        // these rows were written by visitors: check every field
  const s = live.rows || {}, seen = new Set();
  const clean = list => (Array.isArray(list) ? list : []).map(r => {
    const e = !r ? null : okTicker(r.id) ? { id: r.id, kind: 'k' } : own(r);
    if (!e || e.id !== r.id || FINISHED.has(e.id) || seen.has(e.id)) return null;
    seen.add(e.id);
    return { ...e, at: stamp(r.at), n: Number.isInteger(r.n) && r.n > 0 ? r.n : 1, mine: r.mine === true, running: r.running === true, note: typeof r.note === 'string' ? r.note.slice(0, 400) : '' };
  }).filter(Boolean).sort(byAt);
  const queued = clean(s.queued), rejected = clean(s.rejected), failed = clean(s.failed), submitted = clean(s.submitted);
  return { queued, rejected, failed, submitted, mine: submitted.filter(x => x.mine) };
}
const liveNote = () => live.state === 'on' ? null : live.state === 'loading' ? 'Loading' : 'Could not load';
let paint = null;                                          // set by the open view; fills in whatever depends on the API
function paintLive() { if (paint) paint(derive()); }
function note(text, cls) { live.msg = { text, cls: cls || '' }; showMsg(''); }
function showMsg(idle) { const m = $('#msg'); if (!m) return; m.className = 'msg ' + (live.msg ? live.msg.cls : ''); m.textContent = live.msg ? live.msg.text : idle; }
const ERR = { bad: 'Not saved. Check the entry and try again.', queued: 'That one is already queued.', done: 'That one already has a finished run.', declined: 'That one was declined.', dup: 'You already submitted that.',
  cap: `You have ${MAX_MINE} submissions waiting for approval. Withdraw one first.`, rate: 'Too many submissions from this network today. Try again tomorrow.', full: 'The list is full for now. Try again later.',
  login: 'Wrong email or password.', locked: 'Too many attempts. Try again in 15 minutes.', auth: 'You are signed out. Sign in again.' };
async function call(body) {
  const r = await fetch(API, { method: body ? 'POST' : 'GET', credentials: 'same-origin', cache: 'no-store', ...(body ? { headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {}) });
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok || !j) throw { code: j && j.error };
  return j;
}
function take(j) { live.admin = j.admin === true; live.user = typeof j.user === 'string' ? j.user : null; live.rows = j.state || null; live.costs = j.costs || null; live.state = 'on'; }
async function write(body, done) {                         // one request at a time, and only when someone acts
  if (live.busy) return false;
  live.busy = true; live.msg = null; paintLive();
  let ok = false;
  try { take(await call(body)); ok = true; if (done) note(done, 'ok'); }
  catch (e) { const c = e && e.code; if (c === 'auth') live.admin = false; note(ERR[c] || 'Not saved. Try again.', 'err'); }
  live.busy = false; paintLive();
  return ok;
}
async function connect() {
  const slow = setTimeout(() => { if (live.state === 'loading') { live.state = 'failed'; paintLive(); } }, 10000);
  try { take(await call()); } catch (e) { live.state = 'failed'; }
  clearTimeout(slow); paintLive();
}
// the form takes a Kalshi ticker or an own question, picked with the switch at its top
const formHtml = (kind, p, title, tipText, button) => `<form class="submit" data-form="${kind}" novalidate>
  <div class="top"><span class="ttl" tabindex="0" data-tip="${esc(tipText)}">${title}<i class="q" aria-hidden="true">?</i></span>
    <div class="seg" role="group" aria-label="${title}"><button type="button" data-mode="kalshi">Kalshi market</button><button type="button" data-mode="own">Own question</button></div></div>
  <div class="f wide" data-for="kalshi"><label for="${p}-tk">Kalshi ID</label><input id="${p}-tk" name="ticker" class="up" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="200" placeholder="KXTRUMPAPPROVE-26NOV10-U38.8"></div>
  <div class="f wide" data-for="own"><label for="${p}-qt" data-tip="A yes or no question about something that has not happened yet.">Question</label><input id="${p}-qt" name="text" autocomplete="off" maxlength="200" placeholder="Will the Fed cut rates at its January 2027 meeting?"></div>
  <div class="f" data-for="own"><label for="${p}-rd" data-tip="The day the answer will be known.">Resolves on</label><input id="${p}-rd" name="resolves" type="date"></div>
  <div class="f wide" data-for="own"><label for="${p}-rc" data-tip="What has to be true for the answer to be YES, and where that is checked.">Resolves YES if</label><textarea id="${p}-rc" name="criteria" rows="2" maxlength="400" placeholder="The Federal Reserve's statement that day lowers the target range."></textarea></div>
  <button class="btn pri" type="submit">${button}</button>${kind === 'submit' ? '<p class="msg" id="msg" role="status"></p>' : ''}</form>`;
function applyMode() {
  for (const f of document.querySelectorAll('form.submit')) {
    for (const el of f.querySelectorAll('[data-for]')) el.hidden = el.dataset.for !== live.mode;
    for (const b of f.querySelectorAll('[data-mode]')) b.setAttribute('aria-pressed', String(b.dataset.mode === live.mode));
    if (f.elements.resolves) f.elements.resolves.min = today();
  }
}
function fromForm(f) {                                     // what the form holds, or nothing and a message saying what is missing
  if (live.mode !== 'own') { const tk = normTicker(f.elements.ticker.value); return tk ? { id: tk, kind: 'k' } : note('Enter a Kalshi market ticker, for example KXTRUMPAPPROVE-26NOV10-U38.8', 'err'); }
  const text = squash(f.elements.text.value), criteria = squash(f.elements.criteria.value), resolves = f.elements.resolves.value;
  if (text.length < 12) return note('Write the question in full, so it can be answered yes or no.', 'err');
  if (!okDate(resolves) || resolves < today()) return note('Pick the day the answer will be known, today or later.', 'err');
  if (criteria.length < 12) return note('Say what has to be true for the answer to be YES.', 'err');
  return own({ text, resolves, criteria }) || note('Shorten the question or the rule.', 'err');
}
const clearForm = f => { for (const n of ['ticker', 'text', 'resolves', 'criteria']) f.elements[n].value = ''; };
const send = e => e.kind === 'q' ? { text: e.text, resolves: e.resolves, criteria: e.criteria } : { ticker: e.id };
async function submitForm(f) {
  const e = fromForm(f); if (!e) return;
  const d = derive();
  if (live.state !== 'on') return note('Could not load the queue. Reload the page to try again.', 'err');
  if (FINISHED.has(e.id)) return note(That(e) + ' already has a finished run.', 'err');
  if (d.queued.some(q => q.id === e.id)) return note(That(e) + ' is already queued.', 'err');
  if (d.mine.some(i => i.id === e.id)) return note(e.kind === 'q' ? 'You already submitted this question.' : 'You already submitted ' + e.id + '.', 'err');
  if (d.mine.length >= MAX_MINE) return note(ERR.cap, 'err');

}
const withdraw = id => { const e = derive().mine.find(i => i.id === id); if (e) write({ action: 'withdraw', id }, Cap(e) + ' withdrawn.'); };
const decide = (e, status) => { if (e) write({ action: status === 'queued' ? 'approve' : 'decline', id: e.id }, Cap(e) + (status === 'queued' ? ' queued.' : ' declined.')); };
const retry = id => { if (okId(id)) write({ action: 'retry', id }, (okTicker(id) ? id : 'Question') + ' queued again.'); };
const undecide = id => { if (okId(id)) write({ action: 'remove', id }, (okTicker(id) ? id : 'Question') + ' removed.'); };

  const e = fromForm(f); if (!e) return;

  if (await write({ action: 'add', ...send(e) }, Cap(e) + ' queued.')) clearForm(f);

async function loginForm(f) {
  const username = f.elements.username.value.trim(), password = f.elements.password.value;

const logout = () => write({ action: 'logout' }, 'Signed out.');
// the cells of a queue or submission row: a ticker or the question with its date and rule, its type, and its run slot
const what = (e, full) => { const yours = e.mine && !full ? '<span class="flag">yours</span>' : '';
  return e.kind !== 'q' ? `<td class="tk">${esc(e.id)}${yours}</td>`
    : `<td class="qc own"${full ? '' : ` tabindex="0" data-tip="${esc('Resolves YES if\n' + e.criteria)}"`}>${esc(e.text)}${yours}${full ? `<small class="rule">YES if ${esc(e.criteria)}</small>` : ''}<small>resolves ${esc(e.resolves)}${full ? `<span class="qid">${esc(e.id)}</span>` : ''}</small></td>`; };
const kindCell = e => `<td class="nw">${e.kind === 'q' ? 'Own question' : 'Kalshi'}</td>`;
const EVERY = 2 * 3600 * 1000;                             // queued Kalshi markets run one per slot, oldest first
function slots(queued) { const m = new Map(); let t = Math.ceil(Date.now() / EVERY) * EVERY; for (const q of queued) if (q.kind === 'k' && !q.running) { m.set(q.id, new Date(t).toISOString()); t += EVERY; } return m; }
const slotCell = (q, sl) => q.running ? '<td class="nw">now</td>' : q.kind === 'k' ? `<td class="nw">${when(sl.get(q.id))}</td>` : '<td class="nw dimc">needs a brief</td>';

// ---------- overview: finished, queued and submitted runs ----------
function mountOverview() {
  const runs = APP.runs, at = p => (p * 100).toFixed(1) + '%';
  const strip = r => {
    const a = r.aggregates, tipText = `${r.market == null ? 'No market price' : 'Market at freeze ' + P(r.market)}\nSingle call ${P(r.a0)}\nPanel before talking ${P(a.prior)}\nPanel final ${P(a.equal)}`;
    return `<div class="strip" data-tip="${esc(tipText)}">`
      + (r.market != null ? `<i class="mk" style="left:${at(r.market)}"></i>` : '') + (r.a0 != null ? `<i class="sc" style="left:${at(r.a0)}"></i>` : '')
      + (a.prior != null ? `<i class="al" style="left:${at(a.prior)}"></i>` : '') + (a.equal != null ? `<i class="fi" style="left:${at(a.equal)}"></i>` : '') + '</div>';
  };
  const runRows = runs.map(r => {
    const a = r.aggregates, replies = r.posts.reduce((s, p) => s + (p.round > 0 ? p.answers.length : 0), 0), likes = r.posts.reduce((s, p) => s + p.likes.length, 0);
    const moved = a.equal != null && a.prior != null ? (a.equal - a.prior) * 100 : null;
    return `<tr class="go" data-go="run-${r.run_id}">
      <td class="nw">${r.finished.slice(11, 16)}<small>${r.finished.slice(0, 10)}</small></td>

      <td class="n">${signed(moved)}</td><td class="n">${r.sd_alone == null ? '–' : (r.sd_alone * 100).toFixed(1)} / ${r.sd_final == null ? '–' : (r.sd_final * 100).toFixed(1)}</td>
      <td>${outcomeChip(r.outcome)}</td><td class="n${r.brier == null ? ' dimc' : ''}">${r.brier == null ? '–' : r.brier.toFixed(3)}</td>

    <section class="card a-fin"><header>${head('Finished runs', TIP.finished)}</header>
      <div class="key"><span><i class="mk"></i>market at freeze</span><span><i class="sc"></i>single call</span><span><i class="al"></i>panel before talking</span><span><i class="fi"></i>panel final</span></div>
      <div class="scroll"><table><thead><tr><th>Finished, UTC</th>${th('ID', TIP.id)}<th>Question</th>${th('0% to 100%', TIP.strip)}${th('Market', TIP.market, 'n')}${th('Single call', TIP.single, 'n')}${th('Before talking', TIP.before, 'n')}${th('Final', TIP.final, 'n')}
        ${th('Moved, pts', TIP.moved, 'n')}${th('Spread', TIP.spread, 'n')}${th('Outcome', TIP.outcome)}${th('Score', TIP.score, 'n')}${th('Replies', TIP.replies, 'n')}${th('Likes', TIP.likes, 'n')}</tr></thead>
        <tbody>${runRows || emptyRow(14, 'No finished runs')}</tbody></table></div></section>
    <section class="card a-que"><header>${head('Queued and submitted runs', TIP.pending)}</header>
      <div class="scroll"><table><thead><tr><th>Market or question</th>${th('Type', TIP.type)}${th('Status', TIP.pending)}${th('Added, UTC', TIP.added)}${th('Runs, UTC', TIP.slot)}${th('Requests', 'How many people asked for this.', 'n')}<th></th></tr></thead><tbody id="b-pend"></tbody></table></div></section>`;
  view.appendChild(el);

    const wait = liveNote(), can = live.state === 'on';
    $('#t-que').textContent = wait ? '–' : d.queued.length; $('#t-sub').textContent = wait ? '–' : d.submitted.length;
    const sl = slots(d.queued), rows = [

// ---------- agents and scoring ----------
function mountAgents() {
  const scoreRows = APP.scored.map(s => {
    const ref = s.key === 'fifty' || s.key === 'market', w = s.brier == null ? 0 : Math.min(100, s.brier / .5 * 100);
    return `<tr${s.key === 'PANEL' ? ' class="hl"' : ''}><td class="nw">${s.key === 'PANEL' ? '<b>' + esc(s.label) + '</b>' : esc(s.label)}</td><td class="n">${s.n}</td>

      <td class="n${s.brier == null ? ' dimc' : ''}">${s.brier == null ? '–' : s.brier.toFixed(3)}</td></tr>`;
  }).join('');
  const maxLikes = Math.max(1, ...APP.agents.map(m => m.likes));
  const agentRows = APP.agents.map((m, i) => `<tr><td><span class="who" style="--c:${COLORS[i % COLORS.length]}"><i></i>${esc(m.name)}</span></td>
      <td class="mth">${esc(m.method)}</td><td class="n">${m.runs}</td><td class="n${m.challenger ? '' : ' dimc'}">${m.challenger}</td>
      <td class="n">${m.move == null ? '–' : (m.move * 100).toFixed(1)}</td>
      <td><span class="mag lk" data-tip="${esc(m.name)}\n${m.likes} likes received"><i style="width:${(m.likes / maxLikes * 100).toFixed(1)}%${m.likes ? '' : ';min-width:0'}"></i></span></td><td class="n">${m.likes}</td>

// ---------- every metric for this run, with charts, in a dialog ----------

    ['Spread, pts', `${f1(steps[0].sd)} to ${f1(steps[LAST].sd)}`, T.spread2], ['Outcome', outcomeHtml, T.outcome], ['Score', D.brier == null ? '–' : D.brier.toFixed(3), T.score],
    ['Posts', D.posts.filter(p => p.round >= 1 && p.round <= R).length, T.posts], ['Model calls', calls, T.calls], ['Tokens read', (tin / 1e6).toFixed(2) + 'M', T.tin], ['Tokens written', (tout / 1e3).toFixed(1) + 'k', T.tout],

  const byRound = `<div class="key"><span><i class="ln2"></i>panel, pooled</span><span><i class="sw bd"></i>lowest to highest agent</span>${D.market != null ? '<span><i class="dash"></i>market at freeze</span>' : ''}${D.a0 != null ? '<span><i class="dash dot"></i>single call</span>' : ''}</div>
    <div class="plotgrid">
      <div class="yax">${ticks.map(v => `<span style="top:${yy(v)}%">${pct(v)}</span>`).join('')}</div>

        ${D.market != null ? `<div class="ref${D.market < steps[LAST].mean ? ' under' : ''}" style="top:${yy(D.market)}%"><span>market ${pct(D.market)}</span></div>` : ''}${D.a0 != null ? `<div class="ref dot${D.a0 < steps[0].mean ? ' under' : ''}" style="top:${yy(D.a0)}%"><span>single call ${pct(D.a0, 1)}</span></div>` : ''}

        <div class="cols-x">${steps.map((st, s) => `<div data-tip="${esc(`${sLong(s)}\nPanel ${pct(st.mean, 1)}\nLowest agent ${pct(st.lo)}, highest ${pct(st.hi)}\nSpread ${f1(st.sd)} pts`)}"></div>`).join('')}</div>

    + `<tr class="total"><td>Total</td><td></td><td class="n">${calls}</td><td class="n">${(tin / 1e3).toFixed(0)}k</td><td class="n">${(tout / 1e3).toFixed(1)}k</td></tr>`;

$('#expand').addEventListener('click', () => { document.body.appendChild(tip); tip.hidden = true; dlg.innerHTML = metricsHtml(); dlg.appendChild(tip); dlg.showModal(); dlg.querySelector('.mbody').scrollTop = 0; });

// ---------- the log: one line per thing that happened, in the order it happened ----------
const STEP_TEXT = s => s === 0 ? ['Opening forecasts', 'each agent forecast alone, before anyone spoke']
  : s === LAST ? ['Final forecasts', 'given in private after the discussion; these are scored']
  : [`Round ${s} of ${R}`, 'all ten post at once; likes are private to the agent'];
const delta = (now, was) => { if (now == null || was == null) return ''; const d = Math.round((now - was) * 100); return `<span class="dl ${d > 0 ? 'up' : d < 0 ? 'dn' : ''}">${d > 0 ? '+' + d : d < 0 ? d : '='}</span>`; };
const nameTag = i => `<b style="color:${A[i].c}">${esc(A[i].name)}</b>`;
const which = n => n.p.round === 0 ? 'opening post' : `round ${n.p.round} post`;
const tagOf = s => s === 0 ? 'open' : s === LAST ? 'fin' : 'r' + s;
const EV = [];
function ev(at, cls, html, n) { const el = document.createElement('div'); el.className = 'ln ' + cls; el.innerHTML = html; if (n) { el.dataset.n = n.n; el.style.setProperty('--c', A[n.a].c); } EV.push({ at, el, n, cls }); }
for (let s = 0; s <= LAST; s++) { const [a, b] = STEP_TEXT(s); ev(s, 'hd', `${a}<small># ${b}</small>`); }
postN.forEach(n => {
  const a = A[n.a], r = n.p.round, tg = `<span class="tg">${tagOf(r)}</span>`;
  ev(n.at, 'post', `${tg}<span class="nm">${esc(a.name)}</span>${a.challenger ? '<span class="ch">challenger</span>' : ''}<span class="st">${side(n.p.prob)}</span>${delta(n.p.prob, r > 0 ? series[n.a][r - 1] : null)}<p>${esc(n.p.text)}</p>`, n);
  n.replyTo.forEach(to => ev(n.at + .012, 'ev', `${tg}<span class="gl">↳</span><span>${nameTag(n.a)} replied to ${nameTag(to.a)}</span>`, to));
  n.liked.forEach(l => ev(l.at, 'ev', `${tg}<span class="gl lk">♥</span><span>${nameTag(n.a)} liked ${nameTag(l.tg.a)}'s ${which(l.tg)}</span>`, l.tg));
});
finalN.forEach(n => { const a = A[n.a]; ev(n.at, 'post', `<span class="tg">fin</span><span class="nm">${esc(a.name)}</span>${a.challenger ? '<span class="ch">challenger</span>' : ''}<span class="st">${side(a.final)}</span>${delta(a.final, series[n.a][R])}<p>${esc(a.why)}</p>`, n); });
ev(LAST + .93, 'end', `<span class="tg">done</span><span>panel ${pct(D.aggregates.equal, 1)} ${D.market == null ? '' : ' · market ' + pct(D.market)} · single call ${pct(D.a0, 1)}${D.outcome == null ? '' : ' · outcome ' + (D.outcome ? 'YES' : 'NO')}</span>`);
EV.sort((x, y) => x.at - y.at);
const term = $('#term'), cursor = $('#cursor');
let shown = 0;
function syncTerm() {
  let n = shown;
  while (n < EV.length && EV[n].at <= t) n++;
  while (n > 0 && EV[n - 1].at > t) n--;
  if (n === shown) return;
  const stick = n < shown || term.scrollHeight - term.scrollTop - term.clientHeight < 60;
  if (n > shown) { const f = document.createDocumentFragment(); for (let i = shown; i < n; i++) f.appendChild(EV[i].el); term.insertBefore(f, cursor); }
  else for (let i = shown - 1; i >= n; i--) EV[i].el.remove();
  shown = n;
  if (stick) term.scrollTop = term.scrollHeight;
}

// ---------- reading one thing ----------
function cardHtml(n) {
  const a = A[n.a];
  if (n.kind === 'final') return `<div class="ph"><span class="nm">${esc(a.name)}</span>${a.challenger ? '<span class="ch">challenger</span>' : ''}<span class="pv">${side(a.final)}</span>${delta(a.final, series[n.a][R])}</div><p>${esc(a.why)}</p>`;
  const prev = n.p.round > 0 ? series[n.a][n.p.round - 1] : null;
  const ans = n.replyTo.map(x => nameTag(x.a)).join(', '), lk = n.liked.map(x => nameTag(x.tg.a)).join(', ');
  const likers = links.filter(l => l.kind === 'like' && l.b === n && l.at <= t).map(l => nameTag(l.ai)).join(', ');
  const repliers = links.filter(l => l.kind === 'ans' && l.b === n && l.at <= t).map(l => nameTag(l.ai)).join(', ');
  return `<div class="ph"><span class="nm">${esc(a.name)}</span>${a.challenger ? '<span class="ch">challenger</span>' : ''}<span class="pv">${side(n.p.prob)}</span>${delta(n.p.prob, prev)}</div><p>${esc(n.p.text)}</p><div class="pf">`
    + (ans ? `<span>↳ replies to ${ans}</span>` : '') + (lk ? `<span>♥ liked ${lk}</span>` : '')
    + (repliers ? `<span>replied to by ${repliers}</span>` : '') + (likers ? `<span>liked by ${likers}</span>` : '') + '</div>';
}
function renderSel() {

  else h += `<div class="k">Agent</div><div class="ph" style="--c:${a.c}"><span class="nm">${esc(a.name)}</span>${a.challenger ? '<span class="ch">challenger this question</span>' : ''}</div>

}
const pick = n => { sel = n && n.a != null ? { a: n.a, node: n } : null; renderSel(); };
const toggle = n => pick(sel && sel.node === n ? null : n);
term.addEventListener('click', e => { const ln = e.target.closest('.ln[data-n]'); if (ln) toggle(nodes[+ln.dataset.n]); });
$('#sel').addEventListener('click', e => { if (e.target.id === 'selx') pick(null); });
$('#legend').addEventListener('click', e => { const b = e.target.closest('button'); if (b) toggle(hubs[+b.dataset.a]); });
pills.addEventListener('click', e => { const b = e.target.closest('.pill'); if (b) return toggle(hubs[+b.dataset.a]); const u = e.target.closest('.bub'); if (u) toggle(nodes[+u.dataset.n]); });
function setMode(m) { mode = m; $('#mode-agent').setAttribute('aria-pressed', m === 'agent'); $('#mode-belief').setAttribute('aria-pressed', m === 'belief'); $('#scale').hidden = m !== 'belief'; }
$('#mode-agent').onclick = () => setMode('agent'); $('#mode-belief').onclick = () => setMode('belief');

// ---------- stage ----------
const stage = $('#stage'), cv = $('#cv'), g = cv.getContext('2d');

  const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);

  for (const n of nodes) { const [sx, sy, s, z2] = at3(n.x, n.y, n.z); n.sx = sx; n.sy = sy; n.s = s; n.d = z2; n.fog = Math.max(.3, Math.min(1, 1.02 - (z2 + 330) / 1000)); }
}
// A dot drawn as a lit ball: bright where the light lands, up and to the left, dark at the far edge.
function ball(x, y, r, c, al) {

// Replies and likes travel on an arc that bows away from the middle of the graph. Where it is after a share u of the way:
const onArc = (f, u) => { const v = 1 - u; return [v * v * f[0] + 2 * u * v * f[2] + u * u * f[4], v * v * f[1] + 2 * u * v * f[3] + u * u * f[5]]; };

const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const colOf = n => mode === 'belief' ? belief(n.kind === 'post' ? n.p.prob : n.kind === 'final' ? A[n.a].final : probAt(n.a, t)) : hexRgb(A[n.a].c);
const BASE = { spoke: .3, read: .1, own: .26, ans: .2, like: .1 }, FRESH = { own: .25, ans: .45, like: .3 };
const MONO = '"JetBrains Mono", monospace';
function draw() {
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  project(); visLinks = 0;
  const hot = n => sel && (sel.node === n || (sel.node.kind === 'hub' && n.a === sel.a));
  const flying = [];
  for (const l of links) {
    const born = l.at < 0 ? 9 : t - l.at; if (born < 0) continue; visLinks++;
    const fog = Math.min(l.a.fog, l.b.fog), like = l.kind === 'like';
    const c = like ? LIKE : l.kind === 'read' ? [150, 155, 165] : mode === 'belief' ? colOf(l.a) : hexRgb(A[l.ai].c);
    const fresh = l.at < 0 ? 0 : Math.max(0, 1 - born / FRESH[l.kind]), on = sel ? (hot(l.a) || hot(l.b)) : false;
    let al = BASE[l.kind] * fog;
    if (sel) al = on ? Math.min(1, al * 3.2) : al * .3;
    g.lineWidth = (like || l.kind === 'ans') ? 1 + fresh * 1.2 : 1;
    g.strokeStyle = fresh > 0 ? rgba(like ? LIKE : [255, 255, 255], Math.min(1, al + fresh * .8)) : rgba(c, al);
    g.beginPath(); g.moveTo(l.a.sx, l.a.sy);
    if (!like && l.kind !== 'ans') { g.lineTo(l.b.sx, l.b.sy); g.stroke(); continue; }
    const f = arcOf(l), lin = l.at < 0 ? 1 : Math.min(1, born / (FRESH[l.kind] * .75)), u = lin * lin * (3 - 2 * lin), end = onArc(f, u);
    g.quadraticCurveTo(f[0] + (f[2] - f[0]) * u, f[1] + (f[3] - f[1]) * u, end[0], end[1]); g.stroke();   // the arc so far

  const order = [...nodes].sort((a, b) => b.d - a.d);
  for (const n of order) {
    const born = n.at < 0 ? 9 : t - n.at, live = born >= 0, dim = sel && !hot(n) && n.kind !== 'q' ? .35 : 1;
    if (n.kind === 'q') {
      g.fillStyle = 'rgba(157,140,245,.18)'; g.beginPath(); g.arc(n.sx, n.sy, n.r * n.s * 1.7, 0, 7); g.fill();
      ball(n.sx, n.sy, n.r * n.s, [157, 140, 245], 1);
      g.fillStyle = '#0c1322'; g.font = `700 ${Math.round(13 * n.s)}px ${MONO}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('Q', n.sx, n.sy + 1);

    if (!live) { g.fillStyle = `rgba(140,146,156,${.13 * n.fog})`; g.beginPath(); g.arc(n.sx, n.sy, 2.2 * n.s, 0, 7); g.fill(); continue; }
    const c = colOf(n), fresh = n.at < 0 ? 0 : Math.max(0, 1 - born / .3), pop = Math.min(1, born / .03), al = n.fog * dim;
    const r = (n.kind === 'post' ? n.r + Math.min(3, countAt(n.replyAt, t)) * .9 : n.r) * n.s * pop;

      if (n.kind === 'hub') { g.strokeStyle = rgba(c, .45 * al); g.lineWidth = 1; if (A[n.a].challenger) g.setLineDash([3, 3]); g.beginPath(); g.arc(n.sx, n.sy, r + 4, 0, 7); g.stroke(); g.setLineDash([]); }
    }
    if (n.kind === 'post' && n.likeAt.length) {            // likes this post has by now: a pink ring, and the count

        g.beginPath(); g.arc(n.sx, n.sy, r + 2.5 + Math.min(L, 7) * .9, 0, 7); g.stroke();
        if (L >= 3 || recent > 0) { g.fillStyle = rgba(LIKE, Math.min(1, al + .2)); g.font = `700 ${recent > 0 ? 11 : 9.5}px ${MONO}`; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText('♥' + L, n.sx + r + 5 + Math.min(L, 7) * .9, n.sy); }

    const [x, y] = onArc(f, u);

    if (like) { g.fillStyle = rgba(LIKE, 1); g.font = `700 ${Math.round(13 * Math.max(.8, s))}px ${MONO}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('♥', x, y); }
    else { g.fillStyle = 'rgba(255,255,255,.2)'; g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill(); ball(x, y, 3, [236, 240, 250], 1); }
  }
  hubs.forEach((h, i) => { const b = hubPill[i]; b.style.transform = `translate(${h.sx.toFixed(1)}px,${(h.sy - 13 * h.s).toFixed(1)}px) translate(-50%,-100%)`; b.style.opacity = (sel && sel.a !== i ? .45 : 1) * Math.min(1, h.fog + .15); b.style.zIndex = 1000 - Math.round(h.d); });
  LENS.forEach((l, i) => { const n = lensN[l]; lensTag[i].style.transform = `translate(${(n.sx + 8).toFixed(1)}px,${(n.sy - 7).toFixed(1)}px)`; lensTag[i].style.opacity = n.fog * .9; });
  qTag.style.transform = `translate(${Qn.sx.toFixed(1)}px,${(Qn.sy + 16 * Qn.s).toFixed(1)}px) translate(-50%,0)`;
  for (const o of bubs) {                                  // what was just said, beside the dot that said it
    const born = t - o.n.at, on = born >= 0 && born < BUB;
    if (on !== o.on) { o.on = on; o.b.hidden = !on; }
    if (!on) continue;
    const left = o.n.sx > W * .6;
    o.b.style.transform = `translate(${(o.n.sx + (left ? -10 : 10)).toFixed(1)}px,${(o.n.sy - 10).toFixed(1)}px) translate(${left ? '-100%' : '0'},-100%)`;
    o.b.style.opacity = Math.min(1, (BUB - born) / .05).toFixed(2); o.b.style.zIndex = 3000 + Math.round(o.n.at * 100);

// drag to turn, click to read
let down = null;
stage.addEventListener('pointerdown', e => { if (e.target.closest('.pill, .bub')) return; down = { x: e.clientX, y: e.clientY, moved: 0 }; stage.classList.add('drag'); });
on('pointermove', e => { if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y; down.moved += Math.abs(dx) + Math.abs(dy); userYaw += dx * .006; pitch = Math.max(-1.1, Math.min(1.1, pitch - dy * .004)); down.x = e.clientX; down.y = e.clientY; });
on('pointerup', e => {
  if (!down) return; const was = down; down = null; stage.classList.remove('drag');
  if (was.moved > 5) return;
  const b = stage.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top; let best = null, bd = 14;
  for (const n of nodes) { if (n.kind === 'q' || n.kind === 'lens' || (n.at >= 0 && n.at > t)) continue; const d = Math.hypot(n.sx - x, n.sy - y); if (d < bd) { bd = d; best = n; } }
  pick(best);
});
on('pointercancel', () => { down = null; stage.classList.remove('drag'); });

// the panel list can be moved around the graph and put back
{
  const lg = document.querySelector('.legend'), wrap = lg.parentElement, grab = $('#lg-grab'), rst = $('#lg-reset'), KEY = 'supercast.legend';
  let pos = null, drag = null;
  const floating = () => getComputedStyle(lg).position === 'absolute';
  const fit = (x, y) => ({ x: Math.min(Math.max(4, wrap.clientWidth - lg.offsetWidth - 4), Math.max(4, x)), y: Math.min(Math.max(4, wrap.clientHeight - lg.offsetHeight - 4), Math.max(4, y)) });
  const place = () => {
    rst.hidden = !pos;
    if (!pos) { lg.style.left = lg.style.top = ''; return; }
    const p = fit(pos.x, pos.y); lg.style.left = p.x + 'px'; lg.style.top = p.y + 'px';
  };
  const save = () => { try { if (pos) localStorage.setItem(KEY, JSON.stringify(pos)); else localStorage.removeItem(KEY); } catch (err) {} };
  const reset = () => { pos = null; place(); save(); };
  try { const p = JSON.parse(localStorage.getItem(KEY)); if (p && Number.isFinite(p.x) && Number.isFinite(p.y)) pos = { x: p.x, y: p.y }; } catch (err) {}
  lg.addEventListener('pointerdown', e => {
    if (e.button || !e.target.closest('.grab, .lh') || e.target.closest('button') || !floating()) return;
    drag = { dx: e.clientX - lg.offsetLeft, dy: e.clientY - lg.offsetTop, x: e.clientX, y: e.clientY, on: false }; lg.setPointerCapture(e.pointerId); e.preventDefault();

    pos = fit(e.clientX - drag.dx, e.clientY - drag.dy); place();
  });
  const end = () => { if (!drag) return; const moved = drag.on; drag = null; lg.classList.remove('moving'); if (moved) save(); };
  lg.addEventListener('pointerup', end); lg.addEventListener('pointercancel', end);
  grab.addEventListener('dblclick', reset); rst.addEventListener('click', reset);
  grab.addEventListener('keydown', e => {
    const d = { ArrowLeft: [-16, 0], ArrowRight: [16, 0], ArrowUp: [0, -16], ArrowDown: [0, 16] }[e.key];

// ---------- chart ----------
const ch = $('#chart'), cg = ch.getContext('2d');
let CW = 0, CH = 0; const PAD = { l: 34, r: 96, t: 8, b: 18 };
const ro2 = new ResizeObserver(() => { CW = ch.clientWidth; CH = ch.clientHeight; ch.width = CW * dpr; ch.height = CH * dpr; }); ro2.observe(ch);
const allv = series.flat().concat([D.market, D.a0]).filter(v => v != null);
const Y0 = Math.floor((Math.min(...allv) - .03) * 10) / 10, Y1 = Math.ceil((Math.max(...allv) + .03) * 10) / 10;
const X = s => PAD.l + (s / LAST) * (CW - PAD.l - PAD.r), Y = p => PAD.t + (1 - (p - Y0) / (Y1 - Y0)) * (CH - PAD.t - PAD.b);
function drawChart() {
  if (!CW) return; cg.setTransform(dpr, 0, 0, dpr, 0, 0); cg.clearRect(0, 0, CW, CH);
  cg.font = `10px ${MONO}`; cg.textBaseline = 'middle';
  for (let p = Y0; p <= Y1 + 1e-9; p += .1) { cg.strokeStyle = '#282c33'; cg.lineWidth = 1; cg.beginPath(); cg.moveTo(PAD.l, Y(p)); cg.lineTo(CW - PAD.r, Y(p)); cg.stroke(); cg.fillStyle = '#5d636c'; cg.textAlign = 'right'; cg.fillText(Math.round(p * 100) + '%', PAD.l - 6, Y(p)); }
  cg.textAlign = 'center'; cg.textBaseline = 'alphabetic';
  for (let s = 0; s <= LAST; s++) { cg.fillStyle = s === stepOf(t) ? '#e9e6df' : '#5d636c'; cg.fillText(s === 0 ? 'open' : s === LAST ? 'final' : s, X(s), CH - 4); }
  cg.textAlign = 'left'; cg.textBaseline = 'middle';
  const ref = (p, label, dash) => { cg.setLineDash(dash); cg.strokeStyle = '#9aa0a8'; cg.beginPath(); cg.moveTo(PAD.l, Y(p)); cg.lineTo(CW - PAD.r, Y(p)); cg.stroke(); cg.setLineDash([]); cg.fillStyle = '#9aa0a8'; cg.fillText(label, CW - PAD.r + 6, Y(p)); };
  if (D.market != null) ref(D.market, 'market ' + pct(D.market), [5, 4]); if (D.a0 != null) ref(D.a0, '1 call ' + pct(D.a0), [1, 3]);

}
ch.addEventListener('click', e => { const b = ch.getBoundingClientRect(), s = Math.max(0, Math.min(LAST, Math.round(((e.clientX - b.left - PAD.l) / (CW - PAD.l - PAD.r)) * LAST))); t = s + .95; setPlaying(false); });

// ---------- loop ----------
let prev = performance.now(); const txt = {};
const setText = (id, v) => { if (txt[id] !== v) { txt[id] = v; const el = document.getElementById(id); if (el) el.textContent = v; } };
function frame(now) {
  if (!alive) return;
  const dt = Math.min(.1, (now - prev) / 1000); prev = now;
  if (playing) { t += dt / STEP_SEC * speed; if (t >= END) { t = END; setPlaying(false); } }
  yaw = .5 + (t / END) * Math.PI * 2 + userYaw;                 // one full turn over the run
  const s = stepOf(t); if (s !== shownStep) { shownStep = s; $('#stepname').textContent = STEP_TEXT(s)[0]; }
  syncTerm();
  const now_ = A.map((_, i) => probAt(i, t));
  now_.forEach((p, i) => {
    const v = pct(p), L = likesOf(i, t);
    if (txt['lv' + i] !== v) { txt['lv' + i] = v; document.getElementById('lv' + i).textContent = v; hubPill[i].children[0].textContent = v; }
    if (txt['ll' + i] !== L) { txt['ll' + i] = L; document.getElementById('ll' + i).textContent = '♥' + L; hubPill[i].children[1].textContent = L ? '♥' + L : ''; }
  });
  const nLikes = countAt(likeT, t);
  setText('tc-posts', String(postN.reduce((c, n) => c + (n.at <= t ? 1 : 0), 0))); setText('tc-replies', String(countAt(ansT, t))); setText('tc-likes', String(nLikes));
  const pn = pool(now_), pk = pn == null ? '' : pn.toFixed(3); setText('f-now', pct(pn, 1));
  if (txt.pk !== pk) { txt.pk = pk; const m = document.getElementById('f-nowmark'), e = document.getElementById('f-now'); if (m) { m.hidden = pn == null; if (pn != null) m.style.left = pos(pn); } if (e) e.style.color = bcol(pn); }
  const spread = sd(now_); setText('f-sd', spread == null ? '–' : (spread * 100).toFixed(1) + ' pts');
  setText('where', s === 0 ? 'opening' : s === LAST ? 'final forecasts' : `round ${s} of ${R}`);
  if (document.activeElement !== $('#scrub') || playing) $('#scrub').value = t;
  draw(); drawChart();
  setText('readout', `yaw ${(((yaw * 180 / Math.PI) % 360 + 360) % 360).toFixed(1)}° · links ${visLinks} · likes ${nLikes}`);
  requestAnimationFrame(frame);
}
setPlaying(playing); requestAnimationFrame(frame);
window.replay = { get t() { return t; }, set t(v) { t = v; }, setPlaying };       // for poking at it from the console
return () => { alive = false; ac.abort(); ro1.disconnect(); ro2.disconnect(); if (dlg.open) dlg.close(); };
}

window.supercast = { live, paintLive, derive };            // for poking at it from the console
route(location.hash.slice(1));
connect().catch(() => { live.state = 'failed'; paintLive(); });
</script>
